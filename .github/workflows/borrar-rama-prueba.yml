# Temporal: borra la rama de prueba de la compactación antigua. Se elimina del repo tras ejecutarse.
name: borrar-rama-prueba
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/prueba-compactacion"
