# Temporal: borra la rama de prueba de la compactación antigua. Se elimina del repo tras ejecutarse.
name: borrar-rama-prueba
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - run: git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete prueba-compactacion
