# Compactación mensual de la rama `data`: sustituye todo su historial por un único commit con lo que hay ahora
# (últimos 8 días, riesgo_estado.json, capas estáticas y muestras). `main` (el código) no se toca nunca.
# Reescribe la rama data (force push con lease); nada la clona fuera de los workflows.
name: compactar

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compactar
  cancel-in-progress: false

jobs:
  compactar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Compactar la rama data
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ok=0
          for i in 1 2 3; do
            cd "$RUNNER_TEMP" && rm -rf work
            git clone -q --depth 1 --branch data "$URL" work
            cd work
            base=$(git rev-parse HEAD)
            before=$(du -sk .git | cut -f1)
            git checkout -q --orphan compactada
            git add -A
            git -c user.name="viajes-dgt-bot" -c user.email="viajes-dgt-bot@users.noreply.github.com" \
              commit -q -m "histórico compactado $(date -u +%Y-%m-%d)"
            echo "compactar: archivos $(git ls-files | wc -l), .git ${before} kB (clon superficial)"
            # El lease evita pisar un commit que el recolector haya subido mientras tanto; si falla, se repite todo
            if git push --force-with-lease="data:${base}" origin HEAD:refs/heads/data; then ok=1; break; fi
            echo "compactar: el recolector subió algo entre medias, reintento $i"
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "compactar: no se pudo subir"; exit 1; }
          echo "compactar: rama data compactada"
