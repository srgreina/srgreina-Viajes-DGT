# Se ejecuta también al editar este archivo (primera carga y tras cambios en los parsers)
name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml"]

permissions:
  contents: write
  actions: write   # para que el job "siguiente" pueda relanzar este workflow

# Grupo propio: la cadena de ejecuciones (job "siguiente") lo mantiene ocupado casi siempre, y si static.yml
# compartiera grupo se quedaría pendiente y sería descartada por cada relanzamiento. Los push a main se
# protegen con reintentos (pull --rebase + push) en vez de con el grupo.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Estado anterior (rama latest)
        run: |
          mkdir -p prev
          if git ls-remote --exit-code --heads origin latest >/dev/null 2>&1; then
            git fetch --depth=1 origin latest
            git archive FETCH_HEAD | tar -x -C prev
          fi

      - name: Recolectar incidencias y paneles
        run: python collector/realtime.py --prev prev --out latest --history data/history --samples data/samples

      # Opcional: sin el secreto AEMET_API_KEY se omite; un fallo no frena la recolección de la DGT
      - name: Avisos AEMET
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python collector/aemet.py --prev prev --out latest --samples data/samples

      - name: Calidad de dato
        continue-on-error: true
        run: python collector/calidad.py --latest latest --history data/history --static data/static --out latest

      - name: Guardar histórico en main
        run: |
          git config user.name "viajes-dgt-bot"
          git config user.email "viajes-dgt-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "histórico $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 4))
            done
          fi

      - name: Publicar estado actual en la rama latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d data/static ]; then
            mkdir -p latest/static
            cp -r data/static/. latest/static/
          fi
          cd latest
          git init -q -b latest
          git add -A
          git -c user.name="viajes-dgt-bot" -c user.email="viajes-dgt-bot@users.noreply.github.com" \
            commit -qm "latest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" latest

  # El cron de GitHub no es fiable: cada ejecución lanza la siguiente tras 9 min.
  # El cron y el push de arriba quedan de respaldo; el grupo de concurrencia evita que se acumulen cadenas.
  siguiente:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Esperar y relanzar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 540
          gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
