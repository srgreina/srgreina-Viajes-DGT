# Se ejecuta también al editar este archivo (primera carga, nuevas capas y tras cambios en los parsers). Última: parser dedicado de recarga VE
name: static

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/static.yml"]

permissions:
  contents: write

# Grupo propio (no compartido con collect, ver collect.yml)
concurrency:
  group: static
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # El histórico y las capas estáticas viven en la rama `data` (no en main: así main solo cambia con el código)
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar capas estáticas
        run: python collector/static_layers.py --out data/static --samples data/samples

      # Incremental: solo procesa los días completos nuevos del histórico (estado en data/history/riesgo_estado.json)
      - name: Tramos de riesgo
        continue-on-error: true
        run: python collector/riesgo.py --history data/history --out data/static

      - name: Guardar cambios en la rama data
        run: |
          cd data
          git config user.name "viajes-dgt-bot"
          git config user.email "viajes-dgt-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "capas estáticas $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin data && git push origin HEAD:data && break
              sleep $((i * 4))
            done
          fi
