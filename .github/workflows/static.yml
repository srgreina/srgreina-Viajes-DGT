name: static

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar capas estáticas
        run: python collector/static_layers.py --out data/static --samples data/samples

      - name: Guardar cambios en main
        run: |
          git config user.name "viajes-dgt-bot"
          git config user.email "viajes-dgt-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "capas estáticas $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
